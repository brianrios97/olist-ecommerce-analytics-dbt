olist_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5434') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'olist_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'olist_dev_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'olist_dw') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4
